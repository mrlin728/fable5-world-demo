<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OPENVZ World Lab — 实时程序化 3D 世界</title>
    <meta
      name="description"
      content="A browser-native procedural world experiment by OPENVZ AI. Terrain, forests, atmosphere and water generated in real time with WebGPU."
    />
    <!-- Paper ground, ink rule, cobalt mark — the site's favicon language. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F3EEE0'/%3E%3Crect x='1.5' y='1.5' width='29' height='29' fill='none' stroke='%230A0A0A' stroke-width='3'/%3E%3Cpath d='M16 7 26 26H6Z' fill='%232A2AFF'/%3E%3C/svg%3E"
    />

    <!-- The boot screen paints before any module has parsed, so the two faces
         it uses are fetched up front. Everything else waits for worldLab.css. -->
    <link rel="preload" href="/fonts/anton-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/mono-400.woff2" as="font" type="font/woff2" crossorigin />

    <style>
      /* Inline because it has to render before the bundle arrives. Duplicates a
         handful of tokens from src/ui/worldLab.css for that reason; keep the two
         in step. */
      @font-face {
        font-family: 'Anton';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/anton-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Space Mono';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/mono-400.woff2') format('woff2');
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* Paper, not the world's near-black: the first paint belongs to the
           brand, and the canvas covers it the moment the world starts. */
        background: #f3eee0;
        font-family: 'Space Grotesk', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          'Segoe UI', sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #0a0a0aa8;
        font-family: 'Space Mono', ui-monospace, SFMono-Regular, monospace;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        pointer-events: none;
        transition: opacity 0.5s ease;
        z-index: 70;
        background: #f3eee0;
        background-image: radial-gradient(#0a0a0a14 1.2px, transparent 1.2px);
        background-size: 22px 22px;
      }
      #boot .title {
        font-family: 'Anton', 'Arial Narrow', Impact, sans-serif;
        font-size: clamp(32px, 6vw, 68px);
        line-height: 0.9;
        color: #0a0a0a;
        margin-bottom: 18px;
        letter-spacing: -0.005em;
        text-transform: uppercase;
        font-weight: 400;
      }
      /* A hard ink-ruled trough that fills with cobalt — the same object as the
         site's progress affordances, not a glowing hairline. */
      #boot .bar {
        width: min(360px, 64vw);
        height: 18px;
        background: #f3eee0;
        border: 3px solid #0a0a0a;
        box-shadow: 4px 4px 0 0 #0a0a0a;
        margin-top: 20px;
        position: relative;
        overflow: hidden;
      }
      #boot .bar > div {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0%;
        background: #2a2aff;
        transition: width 0.2s ease;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot">
      <div class="title">OPENVZ World Lab</div>
      <div id="boot-msg">initializing</div>
      <div class="bar"><div id="boot-bar"></div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
